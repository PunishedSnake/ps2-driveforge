name: Windows x64 — Frieren

on:
  workflow_dispatch:
  push:
    branches: [ main, 'release/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  build-windows:
    name: MSVC x64 / Release + WinUI + Dokany
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSBuild for WinUI
        uses: microsoft/setup-msbuild@v2

      - name: Install verified Inno Setup 6.7.3 compiler
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest $url -OutFile $installer
          $expected = '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732'
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "Inno Setup SHA-256 mismatch: expected $expected, got $actual"
          }
          $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-'
          )
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)"
          }

      - name: Locate Inno Setup compiler
        id: inno
        shell: pwsh
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) {
            $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}) | Where-Object { $_ }
            $candidate = foreach ($root in $roots) {
              Get-ChildItem -LiteralPath $root -Recurse -File -Filter ISCC.exe -ErrorAction SilentlyContinue
            }
            $compiler = $candidate | Select-Object -First 1
          }
          if (-not $compiler) { throw 'ISCC.exe was not found after installing Inno Setup.' }
          $path = if ($compiler.Source) { $compiler.Source } else { $compiler.FullName }
          Write-Host "Inno Setup compiler: $path"
          "compiler=$path" >> $env:GITHUB_OUTPUT

      - name: Install Dokany 2.3.1 SDK/runtime
        shell: pwsh
        run: |
          $url = 'https://github.com/dokan-dev/dokany/releases/download/v2.3.1.1000/Dokan_x64.msi'
          $msi = Join-Path $env:RUNNER_TEMP 'Dokan_x64.msi'
          Invoke-WebRequest $url -OutFile $msi
          $expected = '69FF8CB37BFEC3A75921C85FFD1C6370B50A9EC4ECEF2CF3A009D488DCBF5465'
          $actual = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "Dokany MSI SHA-256 mismatch: expected $expected, got $actual"
          }
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/i', $msi,
            'INSTALLDEVFILES=1',
            '/passive',
            '/norestart'
          )
          if ($process.ExitCode -notin @(0, 3010, 1641)) {
            throw "Dokany MSI installation failed with exit code $($process.ExitCode)"
          }

      - name: Locate Dokany SDK
        id: dokany
        shell: pwsh
        run: |
          $root = Get-ChildItem (Join-Path $env:ProgramFiles 'Dokan') -Directory |
            Where-Object { $_.Name -like 'Dokan*2.3.1*' } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $root) { throw 'Dokany SDK root was not found after installation.' }
          Write-Host "Dokany root: $($root.FullName)"
          $header = Get-ChildItem $root.FullName -Recurse -File -Filter 'dokan.h' | Select-Object -First 1
          $library = Get-ChildItem $root.FullName -Recurse -File -Filter 'dokan2.lib' |
            Where-Object { $_.FullName -notmatch '\\x86\\' } |
            Select-Object -First 1
          if (-not $header -or -not $library) {
            Get-ChildItem $root.FullName -Recurse -File | ForEach-Object { Write-Host $_.FullName }
            throw 'Dokany development header/import library was not installed.'
          }
          Write-Host "Dokany header: $($header.FullName)"
          Write-Host "Dokany library: $($library.FullName)"
          "root=$($root.FullName)" >> $env:GITHUB_OUTPUT

      - name: Build, test and stage complete Frieren payload
        shell: pwsh
        run: .\build-windows.ps1 -Configuration Release -Clean -WithDokany -DokanyRoot '${{ steps.dokany.outputs.root }}'

      - name: Verify canonical Windows package staging
        shell: pwsh
        run: .\scripts\verify-windows-package.ps1

      - name: Verify mount helper accepts quoted drive argument
        shell: pwsh
        run: |
          $helper = '.\dist\windows-x64\PS2-DriveForge-Mount.exe'
          $missingImage = Join-Path $env:RUNNER_TEMP 'driveforge-missing-test-image.img'
          & $helper --image $missingImage --mount 'C:"'
          $code = $LASTEXITCODE
          if ($code -eq 2) {
            throw 'Mount helper rejects the historical C:" argv artifact as invalid syntax.'
          }
          if ($code -ne 1) {
            throw "Expected accepted arguments followed by missing-image exit code 1, got $code."
          }
          $global:LASTEXITCODE = 0
          Write-Host 'Mount helper drive-argument regression passed.'

      - name: Smoke-test Frieren HDL developer tool
        shell: pwsh
        run: |
          .\dist\windows-x64\ps2-driveforge-hdl-tools.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Frieren HDL developer tool did not start.' }

      - name: Smoke-test guarded physical developer tool
        shell: pwsh
        run: |
          # --version deliberately exercises only PE loading/linkage. CI must
          # never guess a runner disk number merely to prove the raw-disk tool
          # starts; GitHub's system drive did not volunteer for PS2 archaeology.
          .\dist\windows-x64\ps2-driveforge-physical-tools.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Frieren physical developer tool did not start.' }

      - name: Build 0.6.0-dev portable and installer packages
        shell: pwsh
        run: |
          .\scripts\make-user-release.ps1 `
            -Version '0.6.0-dev' `
            -Codename 'Frieren' `
            -InnoCompiler '${{ steps.inno.outputs.compiler }}' `
            -DokanyMsi (Join-Path $env:RUNNER_TEMP 'Dokan_x64.msi')

      - name: Verify Frieren development artifacts
        shell: pwsh
        run: |
          $portable = '.\dist\PS2-DriveForge-0.6.0-dev-Frieren-Portable-x64.zip'
          $setup = '.\dist\PS2-DriveForge-0.6.0-dev-Frieren-Setup-x64.exe'
          foreach ($path in @($portable, $setup)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected Frieren development artifact was not produced: $path"
            }
            Write-Host "$path SHA-256: $((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash)"
          }

      - name: Upload Frieren development artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS2-DriveForge-0.6.0-dev-Frieren-windows-x64
          path: |
            dist/PS2-DriveForge-0.6.0-dev-Frieren-Portable-x64.zip
            dist/PS2-DriveForge-0.6.0-dev-Frieren-Setup-x64.exe
          if-no-files-found: error
