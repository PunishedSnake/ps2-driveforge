name: Windows x64 — Emilia

on:
  workflow_dispatch:
  push:
    branches: [ main, 'release/**' ]
  pull_request:

permissions:
  contents: write

jobs:
  build-windows:
    name: MSVC x64 / Release + WinUI + Dokany
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSBuild for WinUI
        uses: microsoft/setup-msbuild@v2

      - name: Install verified Inno Setup 6.7.3 compiler
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest $url -OutFile $installer
          $expected = '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732'
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "Inno Setup SHA-256 mismatch: expected $expected, got $actual"
          }
          $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-'
          )
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)"
          }

      - name: Locate Inno Setup compiler
        id: inno
        shell: pwsh
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) {
            $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}) | Where-Object { $_ }
            $candidate = foreach ($root in $roots) {
              Get-ChildItem -LiteralPath $root -Recurse -File -Filter ISCC.exe -ErrorAction SilentlyContinue
            }
            $compiler = $candidate | Select-Object -First 1
          }
          if (-not $compiler) { throw 'ISCC.exe was not found after installing Inno Setup.' }
          $path = if ($compiler.Source) { $compiler.Source } else { $compiler.FullName }
          Write-Host "Inno Setup compiler: $path"
          "compiler=$path" >> $env:GITHUB_OUTPUT

      - name: Install Dokany 2.3.1 SDK/runtime
        shell: pwsh
        run: |
          $url = 'https://github.com/dokan-dev/dokany/releases/download/v2.3.1.1000/Dokan_x64.msi'
          $msi = Join-Path $env:RUNNER_TEMP 'Dokan_x64.msi'
          Invoke-WebRequest $url -OutFile $msi
          $expected = '69FF8CB37BFEC3A75921C85FFD1C6370B50A9EC4ECEF2CF3A009D488DCBF5465'
          $actual = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "Dokany MSI SHA-256 mismatch: expected $expected, got $actual"
          }
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/i', $msi,
            'INSTALLDEVFILES=1',
            '/passive',
            '/norestart'
          )
          if ($process.ExitCode -notin @(0, 3010, 1641)) {
            throw "Dokany MSI installation failed with exit code $($process.ExitCode)"
          }

      - name: Locate Dokany SDK
        id: dokany
        shell: pwsh
        run: |
          $root = Get-ChildItem (Join-Path $env:ProgramFiles 'Dokan') -Directory |
            Where-Object { $_.Name -like 'Dokan*2.3.1*' } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $root) { throw 'Dokany SDK root was not found after installation.' }
          Write-Host "Dokany root: $($root.FullName)"
          $header = Get-ChildItem $root.FullName -Recurse -File -Filter 'dokan.h' | Select-Object -First 1
          $library = Get-ChildItem $root.FullName -Recurse -File -Filter 'dokan2.lib' |
            Where-Object { $_.FullName -notmatch '\\x86\\' } |
            Select-Object -First 1
          if (-not $header -or -not $library) {
            Get-ChildItem $root.FullName -Recurse -File | ForEach-Object { Write-Host $_.FullName }
            throw 'Dokany development header/import library was not installed.'
          }
          Write-Host "Dokany header: $($header.FullName)"
          Write-Host "Dokany library: $($library.FullName)"
          "root=$($root.FullName)" >> $env:GITHUB_OUTPUT

      - name: Build, test and package complete Emilia payload
        shell: pwsh
        run: .\build-windows.ps1 -Configuration Release -Clean -WithDokany -DokanyRoot '${{ steps.dokany.outputs.root }}'

      - name: Verify canonical Windows package staging
        shell: pwsh
        run: .\scripts\verify-windows-package.ps1

      - name: Verify mount helper accepts RC6 quoted drive argument
        shell: pwsh
        run: |
          $helper = '.\dist\windows-x64\PS2-DriveForge-Mount.exe'
          $missingImage = Join-Path $env:RUNNER_TEMP 'driveforge-missing-test-image.img'
          & $helper --image $missingImage --mount 'C:"'
          $code = $LASTEXITCODE
          if ($code -eq 2) {
            throw 'Mount helper still rejects the RC6 C:" argv artifact as invalid syntax.'
          }
          if ($code -ne 1) {
            throw "Expected accepted arguments followed by missing-image exit code 1, got $code."
          }
          $global:LASTEXITCODE = 0
          Write-Host 'Mount helper drive-argument regression passed.'

      - name: Build final 0.5.0 portable and installer packages
        shell: pwsh
        run: |
          .\scripts\make-user-release.ps1 `
            -Version '0.5.0' `
            -InnoCompiler '${{ steps.inno.outputs.compiler }}' `
            -DokanyMsi (Join-Path $env:RUNNER_TEMP 'Dokan_x64.msi')

      - name: Verify final 0.5.0 release artifacts
        shell: pwsh
        run: |
          $portable = '.\dist\PS2-DriveForge-0.5.0-Emilia-Portable-x64.zip'
          $setup = '.\dist\PS2-DriveForge-0.5.0-Emilia-Setup-x64.exe'
          foreach ($path in @($portable, $setup)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected final 0.5.0 artifact was not produced: $path"
            }
            Write-Host "$path SHA-256: $((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash)"
          }

      - name: Upload final 0.5.0 user release artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS2-DriveForge-0.5.0-Emilia-windows-x64
          path: |
            dist/PS2-DriveForge-0.5.0-Emilia-Portable-x64.zip
            dist/PS2-DriveForge-0.5.0-Emilia-Setup-x64.exe
          if-no-files-found: error

      - name: Publish GitHub Release v0.5.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $portable = '.\dist\PS2-DriveForge-0.5.0-Emilia-Portable-x64.zip'
          $setup = '.\dist\PS2-DriveForge-0.5.0-Emilia-Setup-x64.exe'
          $portableHash = (Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash
          $setupHash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          $notesPath = Join-Path $env:RUNNER_TEMP 'emilia-0.5.0-release-notes.md'
          @"
          PS2 DriveForge 0.5.0 **Emilia** is the first public release of the modern WinUI 3 frontend while retaining the proven Win32 interface as a supported fallback.

          Highlights:
          - read-only APA v2 / PFS v3 inspection and recursive export;
          - native HDLoader metadata parsing with instant zero-I/O partition catalog construction after the APA scan;
          - progressive HDL metadata enrichment, caching, read-ahead and backing-I/O instrumentation;
          - automatic physical PS2 HDD discovery and read-only Dokany Explorer mounting;
          - self-contained WinUI 3 frontend on Windows App SDK 2.4.0 plus the supported Win32 fallback;
          - installer and portable packages validated by the complete 14-test Windows regression suite and Linux sanitizer CI.

          Safety remains structural: physical sources open with `GENERIC_READ`, the public block-device API has no source write operation, and Dokany mounts reject mutations.

          ### Downloads
          - `PS2-DriveForge-0.5.0-Emilia-Setup-x64.exe` (recommended)
          - `PS2-DriveForge-0.5.0-Emilia-Portable-x64.zip`

          ### SHA-256
          - Portable: `$portableHash`
          - Setup: `$setupHash`

          See `CHANGELOG.md` for the full Emilia development history and `docs/rc-hardware-checklist.md` / `docs/REAL_HARDWARE_VALIDATION.md` for validation details.
          "@ | Set-Content -LiteralPath $notesPath -Encoding utf8

          $tag = 'v0.5.0'
          $title = 'PS2 DriveForge 0.5.0 "Emilia"'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $title --notes-file $notesPath --latest
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update the existing v0.5.0 GitHub Release.' }
            gh release upload $tag $portable $setup --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload final v0.5.0 release assets.' }
          } else {
            gh release create $tag $portable $setup `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title $title `
              --notes-file $notesPath `
              --latest
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create GitHub Release v0.5.0.' }
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY
