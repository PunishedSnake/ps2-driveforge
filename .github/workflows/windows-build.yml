name: Windows x64 — Emilia

on:
  workflow_dispatch:
  push:
    branches: [ main, 'release/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  build-windows:
    name: MSVC x64 / Release + WinUI + Dokany
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSBuild for WinUI
        uses: microsoft/setup-msbuild@v2

      - name: Install Dokany 2.3.1 SDK/runtime
        shell: pwsh
        run: |
          $url = 'https://github.com/dokan-dev/dokany/releases/download/v2.3.1.1000/Dokan_x64.msi'
          $msi = Join-Path $env:RUNNER_TEMP 'Dokan_x64.msi'
          Invoke-WebRequest $url -OutFile $msi
          $expected = '69FF8CB37BFEC3A75921C85FFD1C6370B50A9EC4ECEF2CF3A009D488DCBF5465'
          $actual = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "Dokany MSI SHA-256 mismatch: expected $expected, got $actual"
          }
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/i', $msi,
            'INSTALLDEVFILES=1',
            '/passive',
            '/norestart'
          )
          if ($process.ExitCode -notin @(0, 3010, 1641)) {
            throw "Dokany MSI installation failed with exit code $($process.ExitCode)"
          }

      - name: Locate Dokany SDK
        id: dokany
        shell: pwsh
        run: |
          $root = Get-ChildItem (Join-Path $env:ProgramFiles 'Dokan') -Directory |
            Where-Object { $_.Name -like 'Dokan*2.3.1*' } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $root) { throw 'Dokany SDK root was not found after installation.' }
          Write-Host "Dokany root: $($root.FullName)"
          $header = Get-ChildItem $root.FullName -Recurse -File -Filter 'dokan.h' | Select-Object -First 1
          $library = Get-ChildItem $root.FullName -Recurse -File -Filter 'dokan2.lib' |
            Where-Object { $_.FullName -notmatch '\\x86\\' } |
            Select-Object -First 1
          if (-not $header -or -not $library) {
            Get-ChildItem $root.FullName -Recurse -File | ForEach-Object { Write-Host $_.FullName }
            throw 'Dokany development header/import library was not installed.'
          }
          Write-Host "Dokany header: $($header.FullName)"
          Write-Host "Dokany library: $($library.FullName)"
          "root=$($root.FullName)" >> $env:GITHUB_OUTPUT

      - name: Build, test and package complete Emilia payload
        shell: pwsh
        run: .\build-windows.ps1 -Configuration Release -Clean -WithDokany -DokanyRoot '${{ steps.dokany.outputs.root }}'

      - name: Verify canonical Windows package staging
        shell: pwsh
        run: .\scripts\verify-windows-package.ps1

      - name: Freeze RC2 archive name
        shell: pwsh
        run: |
          $source = '.\dist\PS2-DriveForge-0.5.0-Emilia-Release-windows-x64.zip'
          $target = '.\dist\PS2-DriveForge-0.5.0-rc2-Emilia-windows-x64.zip'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Canonical Emilia ZIP was not produced: $source"
          }
          Copy-Item -LiteralPath $source -Destination $target -Force
          Write-Host "RC2 package: $target"
          Write-Host "SHA-256: $((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash)"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: PS2-DriveForge-0.5.0-rc2-Emilia-windows-x64
          path: dist/PS2-DriveForge-0.5.0-rc2-Emilia-windows-x64.zip
          if-no-files-found: error
