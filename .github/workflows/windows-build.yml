name: Windows x64 — Darkness

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-windows:
    name: MSVC x64 / Release + Dokany
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Dokany 2.3.1 SDK/runtime
        shell: pwsh
        run: choco install dokany2 --version=2.3.1.1000 -y --no-progress

      - name: Locate Dokany SDK
        id: dokany
        shell: pwsh
        run: |
          $root = Get-ChildItem (Join-Path $env:ProgramFiles 'Dokan') -Directory |
            Where-Object { $_.Name -like 'Dokan*2.3.1*' } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $root) { throw 'Dokany SDK root was not found after installation.' }
          Write-Host "Dokany root: $($root.FullName)"
          Get-ChildItem $root.FullName -Recurse -File |
            Where-Object { $_.Name -match '^dokan.*\.(h|lib|dll)$' } |
            ForEach-Object { Write-Host $_.FullName }
          "root=$($root.FullName)" >> $env:GITHUB_OUTPUT

      - name: Build, test and package
        shell: pwsh
        run: .\build-windows.ps1 -Configuration Release -Clean -WithDokany -DokanyRoot '${{ steps.dokany.outputs.root }}'

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: PS2-DriveForge-0.4.0-Darkness-windows-x64
          path: dist/PS2-DriveForge-0.4.0-Darkness-Release-windows-x64.zip
          if-no-files-found: error
