name: Windows x64 — Emilia WinUI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/winui/**'
      - '.github/workflows/winui-build.yml'

permissions:
  contents: read

jobs:
  build-winui:
    name: WinUI 3 / C++WinRT x64 Release
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build WinUI frontend
        shell: pwsh
        run: |
          msbuild .\src\winui\PS2DriveForge.WinUI.vcxproj `
            /restore `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RestorePackagesConfig=false
          if ($LASTEXITCODE -ne 0) { throw "WinUI MSBuild failed with exit code $LASTEXITCODE" }

      - name: Verify frontend executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem .\src\winui -Recurse -File -Filter 'PS2-DriveForge-WinUI.exe' |
            Where-Object { $_.FullName -match '\\x64\\Release\\' } |
            Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem .\src\winui -Recurse -File | ForEach-Object { Write-Host $_.FullName }
            throw 'Expected PS2-DriveForge-WinUI.exe was not produced.'
          }
          Write-Host "WinUI frontend: $($exe.FullName)"

      - name: Upload WinUI development artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS2-DriveForge-0.5.0-Emilia-WinUI-x64
          path: |
            src/winui/x64/Release/**
            src/winui/Generated Files/**
          if-no-files-found: warn
